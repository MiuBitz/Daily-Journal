[package]
name = "daily_journal"
version = "1.0.0"
edition = "2021"
description = "Minimal Windows work journal with quick check-ins and weekly text exports"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-dialog = "2.0.0"
tauri-plugin-shell = "2.0.0"
rfd = "0.15.0"
chrono = "0.4.38"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
open = "5.3.0"
mslnk = "0.1.8"
windows-sys = { version = "0.59.0", features = ["Win32_UI_WindowsAndMessaging", "Win32_Media", "Win32_Foundation"] }
image = { version = "0.25.2", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
